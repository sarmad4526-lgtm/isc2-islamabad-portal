<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ISC2 Islamabad Chapter</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="site-wrapper">
        <header class="site-header inner-page-header">
            <div class="header-top">
                <div class="container">
                    <div class="site-branding centered-branding">
                        <div class="site-branding-text">
                            <h1 class="site-title"><a href="index.html">ISC2 Islamabad Chapter</a></h1>
                            <p class="site-description">Connect. Educate. Inspire. Secure.</p>
                        </div>
                    </div>
                </div>
            </div>
            <nav class="navigation-top">
                <div class="container">
                    <button class="menu-toggle" aria-controls="top-menu" aria-expanded="false">
                        <i class="fas fa-bars"></i> Menu
                    </button>
                    <div class="menu-main-menu-container">
                        <ul id="top-menu" class="menu">
                            <li class="menu-item"><a href="index.html">Home</a></li>
                            <li class="menu-item"><a href="membership.html">Membership</a></li>
                            <li class="menu-item"><a href="events.html">Events</a></li>
                            <li class="menu-item"><a href="leadership.html">Leadership</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <div id="content" class="site-content">
            <div class="container">
                <main id="main" class="site-main">
                    <div class="login-wrapper">
                        <div class="login-box">
                            <div class="login-header">
                                <i class="fas fa-shield-alt" style="font-size: 2.5rem; color: var(--accent-blue); margin-bottom: 15px;"></i>
                                <h2>Admin Login</h2>
                                <p>ISC2 Islamabad Chapter Portal</p>
                            </div>
                            <form class="login-form" id="loginForm">
                                <div class="form-row">
                                    <label for="loginEmail">Email</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-envelope"></i>
                                        <input type="email" id="loginEmail" name="loginEmail" placeholder="admin@example.com" required>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <label for="loginPassword">Password</label>
                                    <div class="input-with-icon">
                                        <i class="fas fa-lock"></i>
                                        <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter your password" required>
                                        <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--light-color); font-size: 1rem; padding: 4px;">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="form-row" style="margin-top: 30px;">
                                    <button type="submit" class="btn-login">Sign In</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <footer class="site-footer">
            <div class="container">
                <div class="site-info">
                    <p>&copy; 2025 ISC2 Islamabad Chapter. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>
    <script src="js/script.js"></script>
    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('loginPassword');
        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = isPassword
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';
        });
    </script>
</body>
</html>
